<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources | EduPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .resource-card { transition: all 0.3s ease; border: 1px solid #f1f5f9; }
        .resource-card:hover { transform: translateY(-5px); border-color: #6366f1; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.1); }
        .tab-btn { padding: 1rem; font-weight: 700; color: #64748b; border-bottom: 2px solid transparent; transition: 0.2s; }
        .tab-active { color: #6366f1; border-bottom-color: #6366f1; }
        .spinner { border: 3px solid rgba(0,0,0,0.1); border-radius: 50%; border-top: 3px solid #6366f1; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 hover:bg-indigo-600 hover:text-white transition">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h1 id="subject-display-title" class="text-2xl font-black text-slate-800 capitalize italic">Subject</h1>
            </div>
            <button onclick="openAddModal()" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-100">
                <i class="fas fa-plus mr-2"></i> Add Resource
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 md:p-10">
        <div class="flex gap-8 border-b border-slate-200 mb-10">
            <button onclick="switchTab('notes')" id="tab-notes" class="tab-btn tab-active">Notes</button>
            <button onclick="switchTab('books')" id="tab-books" class="tab-btn">Books</button>
            <button onclick="switchTab('links')" id="tab-links" class="tab-btn">Links</button>
        </div>

        <div id="resource-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <div id="addModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[100] p-6">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-10 shadow-2xl">
            <h3 id="modal-title" class="text-2xl font-black text-slate-800 mb-6">Add Item</h3>
            <div class="space-y-4">
                <input type="text" id="input-title" placeholder="Title" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500">
                <div id="file-section">
                    <input type="file" id="input-file" class="w-full p-4 bg-slate-50 border border-dashed rounded-2xl">
                </div>
                <div id="link-section" class="hidden">
                    <input type="text" id="input-url" placeholder="https://..." class="w-full p-4 bg-slate-50 border rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <div class="flex gap-4 mt-8">
                <button onclick="closeAddModal()" class="flex-1 font-bold text-slate-400">Cancel</button>
                <button onclick="saveResource()" id="save-btn" class="flex-1 py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg">Save to Cloud</button>
            </div>
        </div>
    </div>

<script type="module">
    // 1. Move imports to the ABSOLUTE TOP
    import { db, storage } from './firebase-config.js';
    import { doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    // 2. Global Setup
    const urlParams = new URLSearchParams(window.location.search);
    const subject = urlParams.get('name') || "Subject";
    document.getElementById('subject-display-title').innerText = subject;
    let currentTab = 'notes';

    // 3. Define the render function (Imports are already available above)
    async function render() {
        const grid = document.getElementById('resource-grid');
        grid.innerHTML = `<div class="col-span-full py-10 text-center"><div class="spinner"></div><p>Fetching Cloud Data...</p></div>`;
        
        const user = JSON.parse(localStorage.getItem('currentUser'));
        const docSnap = await getDoc(doc(db, "users", user.regNo));

        if (docSnap.exists()) {
            const data = docSnap.data();
            const items = (data.resources && data.resources[subject] && data.resources[subject][currentTab]) 
                          ? data.resources[subject][currentTab] : [];

            grid.innerHTML = items.length === 0 ? `<div class="col-span-full py-20 text-center text-slate-400">No ${currentTab} found.</div>` : "";
            
            items.forEach((item) => {
                grid.innerHTML += `
                    <div class="resource-card bg-white p-8 rounded-[2rem] cursor-pointer" onclick="window.openResource('${item.data}')">
                        <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-lg flex items-center justify-center mb-4">
                            <i class="fas fa-file-alt"></i>
                        </div>
                        <h4 class="text-lg font-bold text-slate-800">${item.title}</h4>
                    </div>`;
            });
        }
    }

    // 4. Expose functions to window (Important for onclick buttons)
    window.switchTab = (tab) => {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
        document.getElementById(`tab-${tab}`).classList.add('tab-active');
        render();
    };
    window.openAddModal = () => document.getElementById('addModal').classList.replace('hidden', 'flex');
    window.closeAddModal = () => document.getElementById('addModal').classList.replace('flex', 'hidden');
    window.openResource = (url) => window.open(url, '_blank');
    
    // Initial call
    render();
</script>
</body>
</html>
