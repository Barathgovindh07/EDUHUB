<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Faculty Dashboard | EduPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#F8FAFC] flex h-screen overflow-hidden">

    <aside class="w-64 bg-[#1E293B] text-white flex flex-col shrink-0">
        <div class="p-8 border-b border-white/5">
            <h1 class="text-2xl font-black italic uppercase tracking-wider">EduPortal</h1>
            <p class="text-[10px] text-slate-400 font-bold uppercase mt-1 tracking-widest">Faculty Edition</p>
        </div>
        
        <nav class="flex-1 mt-8 px-4 space-y-2">
            <a href="teacher_dashboard.html" class="flex items-center gap-4 p-4 rounded-2xl bg-white/10 shadow-inner">
                <i class="fas fa-users w-5"></i> <span class="font-bold">Student Directory</span>
            </a>
            <a href="teacher_announcements.html" class="flex items-center gap-4 p-4 rounded-2xl hover:bg-white/5 transition">
                <i class="fas fa-bullhorn w-5"></i> <span>Announcements</span>
            </a>
        </nav>

        <div class="p-4 border-t border-white/5">
            <button onclick="logout()" class="w-full flex items-center justify-center gap-3 p-4 rounded-xl bg-red-500/10 text-red-400 hover:bg-red-600 hover:text-white transition font-bold text-sm">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </aside>

    <main class="flex-1 p-12 overflow-y-auto">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h2 class="text-4xl font-black text-slate-800 italic uppercase">Faculty Overview</h2>
                <p id="student-count" class="text-slate-400 font-bold text-sm mt-1 uppercase tracking-widest">Syncing Students...</p>
            </div>
            <div class="relative w-72">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                <input type="text" id="search-bar" placeholder="Search by Reg No..." class="w-full p-4 pl-12 bg-white border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-slate-800 transition shadow-sm">
            </div>
        </header>

        <div id="student-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
            </div>
    </main>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. ROLE GUARD
        const localUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!localUser || localUser.role !== 'teacher') window.location.href = "login.html";

        // 2. FETCH REAL STUDENTS
        const q = query(collection(db, "users"), where("role", "==", "student"));
        
        onSnapshot(q, (snapshot) => {
            const grid = document.getElementById('student-grid');
            document.getElementById('student-count').innerText = `${snapshot.size} Enrolled Students`;
            grid.innerHTML = '';

            snapshot.forEach(doc => {
                const s = doc.data();
                grid.innerHTML += `
                    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-xl transition group">
                        <div class="flex justify-between items-start mb-6">
                            <div class="w-14 h-14 bg-slate-100 text-slate-800 rounded-2xl flex items-center justify-center text-xl font-black group-hover:bg-slate-800 group-hover:text-white transition">
                                ${s.name.charAt(0)}
                            </div>
                            <span class="bg-indigo-50 text-indigo-600 text-[10px] font-black px-3 py-1 rounded-full uppercase italic">Active</span>
                        </div>
                        <h4 class="text-xl font-bold text-slate-800 mb-1">${s.name}</h4>
                        <p class="text-slate-400 font-bold text-xs uppercase tracking-widest mb-8">ID: ${s.regNo}</p>
                        
                        <a href="student_review.html?regNo=${s.regNo}" class="block w-full py-4 bg-slate-50 text-slate-800 rounded-2xl font-bold text-center hover:bg-slate-800 hover:text-white transition shadow-sm">
                            Review Progress
                        </a>
                    </div>`;
            });
        });

        window.logout = () => { localStorage.clear(); window.location.href = "login.html"; };
    </script>
</body>
</html>
